[project]
name = "unit-linked"
version = "0.1.0"
description = "Example unit-linked pricing model built from reviewable tiles"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "tilekit",
]

[tool.uv.sources]
tilekit = { path = "../tilekit", editable = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
