[project]
name = "tilekit"
version = "0.3.0"
description = "Tile graph, engine, trace and rule checks for reviewable actuarial models"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.scripts]
tilekit = "tilekit.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
