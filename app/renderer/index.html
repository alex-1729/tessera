<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tessera</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="trace.css">
<link rel="stylesheet" href="newrepo.css">
</head>
<body>
<header id="topbar">
  <a id="home" href="#/launch" aria-label="Models"><svg id="logo" width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="6" width="24" height="24" fill="#f4efe6"/><rect x="34" y="6" width="24" height="24" fill="none" stroke="#f4efe6" stroke-width="4"/><rect x="6" y="34" width="24" height="24" fill="none" stroke="#f4efe6" stroke-width="4"/><rect x="34" y="34" width="24" height="24" fill="#e08a5c"/></svg><span id="brand">Tessera</span></a>
  <a id="modelname" href="#/launch" title="Back to the list of models"></a>
  <button id="gitline" type="button" class="keep" hidden title="Commit and push…"></button>
  <span class="sp"></span>
  <span id="queuenav">
    <button id="queuebtn" type="button" class="keep" aria-expanded="false" aria-controls="queue">Review queue <b id="queuecount"></b></button>
    <button id="queueprev" type="button">Previous</button>
    <button id="queuenext" type="button">Next</button>
    <span id="queuepos"></span>
  </span>
  <button id="back" type="button">Back</button>
  <button id="forward" type="button">Forward</button>
</header>
<main id="launch" hidden>
  <div id="launchmsg" hidden></div>
  <div id="launchpage"></div>
</main>
<section id="queue" aria-label="Review queue" hidden></section>
<nav id="mods" aria-label="Modules"></nav>
<nav id="tiles" aria-label="Tiles" hidden></nav>
<div id="main">
  <aside id="left" class="bar" aria-label="The tile">
    <div class="barhead"><button type="button" id="hideleft" class="linkbtn keep">Hide</button></div>
    <div id="leftmsgs" class="msgs"><div id="msgs"><div id="working" hidden>Working…</div><div id="error" hidden></div><div id="notice" hidden></div></div></div>
    <div id="panel" class="scroll"></div>
    <div id="lpin"></div>
    <button type="button" id="leftstrip" class="strip keep" aria-label="Show left bar"><span class="nm" id="leftname">Tile</span><span class="attn" id="leftattn" hidden></span></button>
  </aside>
  <div id="center">
    <div id="centermsgs" class="msgs"></div>
    <div id="cbar">
      <div id="seg" role="tablist" aria-label="Centre pane">
        <button type="button" class="seg keep" id="seg-draft" data-seg="draft" role="tab" hidden>Draft to approve</button><button type="button" class="seg keep" id="seg-spreadsheet" data-seg="spreadsheet" role="tab">Spreadsheet</button><button type="button" class="seg keep" id="seg-code" data-seg="code" role="tab">Code</button><button type="button" class="seg keep" id="seg-test" data-seg="test" role="tab">Test</button>
      </div>
      <div id="lines"><div id="realbar" hidden></div><div id="stalebar" hidden></div><div id="sheetbar" hidden></div><div id="tracebar" hidden></div></div>
    </div>
    <div id="stage">
      <div id="gridwrap"><div id="gridhost"></div><div id="nogrid" hidden></div></div>
      <div id="codewrap" hidden></div>
    </div>
  </div>
  <aside id="rightbar" class="bar" aria-label="Chat">
    <div class="barhead"><button type="button" id="hideright" class="linkbtn keep">Hide</button></div>
    <button type="button" id="rightstrip" class="strip keep" aria-label="Show right bar"><span class="nm">Chat</span><span class="attn" id="rightattn" hidden></span></button>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
